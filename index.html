<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FDF6F8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="이솔 비서실" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="이솔님 전용 비서실 — 피클·클로드·뮤즈·키링·챗지피티·인스팅트가 모이는 대회의실·지휘실·라운지." />
<title>이솔 비서실</title>
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=20261126-10" />
<link rel="icon" type="image/png" href="assets/icon-512.png?v=20261126-10" />
<link rel="stylesheet" href="styles.css?v=20261128-5" />
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3.6 8.4l3.5 2.7L12 4.8l4.9 6.3 3.5-2.7-1.5 8.4c-.1.6-.7 1.1-1.3 1.1H6.4c-.6 0-1.2-.5-1.3-1.1L3.6 8.4z" fill="currentColor"/>
            <path d="M7.2 21h9.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="appTitle">이솔 비서실</h1>
          <p class="brand-sub"><span class="brand-dot" aria-hidden="true"></span><span id="ownerLabel">이솔님 전용</span></p>
        </div>
      </div>
      <div class="header-actions">
        <button class="conn-badge is-demo" id="connBadge" type="button" aria-live="polite">
          <span class="conn-dot" aria-hidden="true"></span><span id="connText">로컬 데모</span>
        </button>
        <button class="signout-btn" id="signoutBtn" type="button" title="로그아웃" hidden>나가기</button>
      </div>
    </header>

    <div class="app-notice" id="appNotice" hidden></div>

    <main class="views" id="views">
      <!-- 회의실 -->
      <section class="view is-active" id="view-meeting" data-view="meeting" role="region" aria-label="회의실">
        <div class="room-tabs" id="roomTabs" role="tablist" aria-label="회의실 방"></div>
        <p class="room-status" id="roomStatus"></p>
        <div class="chat-scroll" id="chatScroll">
          <div class="chat-list" id="chatList"></div>
        </div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="recipients" id="recipients" role="group" aria-label="받는 비서"></div>
          <div class="composer-input">
            <textarea id="messageInput" rows="1" placeholder="이솔 님도 직접 메시지·지시를 남겨보세요" aria-label="메시지 입력"></textarea>
            <button class="send-btn" type="submit" aria-label="보내기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4.5 12h13.6M12.4 6.2l6.2 5.8-6.2 5.8"/>
              </svg>
            </button>
          </div>
          <div class="composer-foot">
            <p class="composer-hint" id="composerHint"><span class="kbd-hint">⌘/Ctrl + Enter 전송 · </span>받는 비서를 고르면 그 비서에게만 전달돼요</p>
            <div class="composer-tools">
              <button class="test-btn" type="button" id="testBtn">연결 테스트</button>
              <button class="relay-btn" type="button" id="relayBtn" title="다른 비서 앱에서 받은 답을 회의실 말풍선으로 옮깁니다">⇄ 답 옮기기</button>
              <button class="guide-btn" type="button" id="relayGuideBtn" title="다른 비서 앱과 연결하는 방법">🔗 연결 안내</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>

<!-- 로그인 게이트 — Supabase 인증이 켜져 있으면 비서실 앞을 막는 화면 -->
<div class="auth-gate" id="authGate" hidden>
  <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3.6 8.4l3.5 2.7L12 4.8l4.9 6.3 3.5-2.7-1.5 8.4c-.1.6-.7 1.1-1.3 1.1H6.4c-.6 0-1.2-.5-1.3-1.1L3.6 8.4z" fill="currentColor"/>
        <path d="M7.2 21h9.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="auth-eyebrow">YISOL OFFICE</p>
    <h1 class="auth-title" id="authTitle">이솔 비서실</h1>
    <p class="auth-sub">여섯 비서가 기다리고 있어요.<br>비밀번호로 문을 열어주세요.</p>

    <form class="auth-form" id="authForm" autocomplete="on">
      <label class="auth-field">
        <span>이메일</span>
        <input id="authEmail" name="email" type="email" inputmode="email" autocomplete="username"
               autocapitalize="off" spellcheck="false" placeholder="이메일 주소" required />
      </label>
      <label class="auth-field">
        <span>비밀번호</span>
        <input id="authPassword" name="password" type="password" autocomplete="current-password"
               placeholder="비밀번호" required />
      </label>
      <p class="auth-error" id="authError" role="alert" hidden></p>
      <button class="auth-submit" id="authSubmit" type="submit">로그인</button>
    </form>

    <p class="auth-hint">처음이라면 Supabase 대시보드 <b>Authentication → Users → Add user</b>에서<br>계정을 하나 만든 뒤 로그인하세요.</p>
    <p class="auth-note"><span class="lock-dot" aria-hidden="true"></span>로그인 정보는 이 기기에만, 기록은 Supabase에만 남습니다.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script src="config.js?v=20261126-9"></script>
<script src="app.js?v=20261128-5"></script>
</body>
</html>
